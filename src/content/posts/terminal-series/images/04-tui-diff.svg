<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1120" viewBox="0 0 720 1120" role="img" aria-labelledby="title desc">
  <title id="title">TUI 从前后两帧计算终端更新</title>
  <desc id="desc">TUI 应用生成目标画面，渲染库比较上一帧和当前帧，只把变化的单元格转换为光标移动、显示属性和文本序列</desc>
  <rect width="720" height="1120" fill="#ebe7dc"/>
  <text x="56" y="62" fill="#69706b" font-family="system-ui,sans-serif" font-size="18" letter-spacing="3">FRAME → DIFF → SEQUENCES</text>

  <g font-family="system-ui,sans-serif">
    <rect x="56" y="98" width="608" height="126" rx="6" fill="#fbfaf6" stroke="#cbc5b8" stroke-width="2"/>
    <text x="84" y="136" fill="#92704c" font-size="16" font-weight="800">APPLICATION STATE</text>
    <text x="84" y="180" fill="#171916" font-size="28" font-weight="800">任务 B：pending → running</text>

    <path d="M360 224v48" stroke="#2d7e82" stroke-width="4"/><path d="m349 258 11 14 11-14" fill="none" stroke="#2d7e82" stroke-width="4"/>

    <rect x="56" y="272" width="286" height="280" rx="6" fill="#171b1b"/>
    <text x="80" y="310" fill="#82bbb5" font-size="16" font-weight="800">上一帧 · PHYSICAL</text>
    <rect x="80" y="334" width="238" height="46" rx="3" fill="#242b2a"/><text x="98" y="364" fill="#f4f0e7" font-family="ui-monospace,monospace" font-size="17">Tasks</text>
    <rect x="80" y="388" width="238" height="46" rx="3" fill="#203332"/><text x="98" y="418" fill="#66a967" font-family="ui-monospace,monospace" font-size="17">✓ A done</text>
    <rect x="80" y="442" width="238" height="46" rx="3" fill="#242b2a"/><text x="98" y="472" fill="#e4c06b" font-family="ui-monospace,monospace" font-size="17">· B pending</text>
    <rect x="80" y="496" width="238" height="34" rx="3" fill="#30273a"/><text x="98" y="519" fill="#d2a3ed" font-family="ui-monospace,monospace" font-size="15">1 / 2</text>

    <rect x="378" y="272" width="286" height="280" rx="6" fill="#171b1b"/>
    <text x="402" y="310" fill="#82bbb5" font-size="16" font-weight="800">当前帧 · VIRTUAL</text>
    <rect x="402" y="334" width="238" height="46" rx="3" fill="#242b2a"/><text x="420" y="364" fill="#f4f0e7" font-family="ui-monospace,monospace" font-size="17">Tasks</text>
    <rect x="402" y="388" width="238" height="46" rx="3" fill="#203332"/><text x="420" y="418" fill="#66a967" font-family="ui-monospace,monospace" font-size="17">✓ A done</text>
    <rect x="402" y="442" width="238" height="46" rx="3" fill="#332f25" stroke="#e4c06b" stroke-width="2"/><text x="420" y="472" fill="#e4c06b" font-family="ui-monospace,monospace" font-size="17">▶ B running</text>
    <rect x="402" y="496" width="238" height="34" rx="3" fill="#30273a"/><text x="420" y="519" fill="#d2a3ed" font-family="ui-monospace,monospace" font-size="15">1 / 2</text>

    <path d="M360 552v48" stroke="#2d7e82" stroke-width="4"/><path d="m349 586 11 14 11-14" fill="none" stroke="#2d7e82" stroke-width="4"/>

    <rect x="56" y="600" width="608" height="166" rx="6" fill="#f2e4d2" stroke="#d0b184" stroke-width="2"/>
    <text x="84" y="638" fill="#ad6a26" font-size="16" font-weight="800">DIFF</text>
    <text x="84" y="678" fill="#171916" font-size="26" font-weight="800">只有第 3 行发生变化</text>
    <g font-family="ui-monospace,monospace" font-size="17" text-anchor="middle">
      <rect x="84" y="706" width="66" height="38" rx="3" fill="#dce9e6"/><text x="117" y="731" fill="#2d7e82">row 3</text>
      <rect x="162" y="706" width="72" height="38" rx="3" fill="#332f25"/><text x="198" y="731" fill="#e4c06b">col 1</text>
      <text x="260" y="731" fill="#686b63">→</text>
      <rect x="284" y="706" width="270" height="38" rx="3" fill="#171b1b"/><text x="419" y="731" fill="#f4f0e7">▶ B running</text>
    </g>

    <path d="M360 766v48" stroke="#2d7e82" stroke-width="4"/><path d="m349 800 11 14 11-14" fill="none" stroke="#2d7e82" stroke-width="4"/>

    <rect x="56" y="814" width="608" height="152" rx="6" fill="#203332" stroke="#53827d" stroke-width="2"/>
    <text x="84" y="852" fill="#8fd0c7" font-size="16" font-weight="800">TERMINAL OUTPUT</text>
    <text x="84" y="893" fill="#f4f0e7" font-family="ui-monospace,monospace" font-size="20">CSI 3;1 H</text>
    <text x="262" y="893" fill="#83908b" font-size="17">移动到第 3 行</text>
    <text x="84" y="930" fill="#f4f0e7" font-family="ui-monospace,monospace" font-size="20">CSI K  ▶ B running</text>
    <text x="385" y="930" fill="#83908b" font-size="17">擦除并重写</text>

    <path d="M360 966v48" stroke="#2d7e82" stroke-width="4"/><path d="m349 1000 11 14 11-14" fill="none" stroke="#2d7e82" stroke-width="4"/>

    <rect x="134" y="1014" width="452" height="62" rx="6" fill="#171b1b"/>
    <text x="360" y="1053" text-anchor="middle" fill="#66a967" font-size="23" font-weight="800">Terminal 只更新变化区域</text>
  </g>
  <text x="56" y="1102" fill="#69706b" font-family="system-ui,sans-serif" font-size="17">应用描述目标画面，渲染库负责选择更新序列。</text>
</svg>
