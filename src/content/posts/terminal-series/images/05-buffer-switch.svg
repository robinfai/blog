<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1160" viewBox="0 0 720 1160" role="img" aria-labelledby="title desc">
<title id="title">Normal 与 Alternate Buffer 的活动状态切换</title><desc id="desc">同一 PTY 的输出由终端解析器解释。向下的 CSI ? 1049 h 进入 Alternate Buffer；向上的 CSI ? 1049 l 返回 Normal Buffer。示例当前活动的是 Alternate Buffer，Renderer 绘制它。</desc>
<rect width="720" height="1160" fill="#ebe7dc"/>
<text x="56" y="60" fill="#555c55" font-family="Noto Sans CJK SC,system-ui,sans-serif" font-size="20" font-weight="600" text-anchor="start">SAME PTY · TWO SCREEN BUFFERS</text>
<rect x="56" y="100" width="608" height="112" rx="6" fill="#fbfaf6" stroke="#cbc5b8" stroke-width="2"/>
<text x="84" y="141" fill="#171916" font-family="Noto Sans CJK SC,system-ui,sans-serif" font-size="27" font-weight="800" text-anchor="start">PTY 输出 → Terminal Parser</text>
<text x="84" y="180" fill="#555c55" font-family="Noto Sans CJK SC,system-ui,sans-serif" font-size="23" font-weight="400" text-anchor="start">解析字符、光标命令与 Buffer 切换序列</text>
<path d="M360 212V264" stroke="#24696e" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M350 252L360 264l10 -12" stroke="#24696e" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="56" y="264" width="608" height="668" rx="6" fill="#171b1b"/>
<text x="84" y="307" fill="#8fd0c7" font-family="Noto Sans CJK SC,system-ui,sans-serif" font-size="22" font-weight="700" text-anchor="start">TERMINAL MEMORY</text>
<rect x="84" y="344" width="552" height="184" rx="6" fill="#242b2a" stroke="#a38443" stroke-width="2"/>
<text x="112" y="385" fill="#e4c06b" font-family="Noto Sans CJK SC,system-ui,sans-serif" font-size="24" font-weight="800" text-anchor="start">NORMAL BUFFER</text>
<text x="112" y="429" fill="#f4f0e7" font-family="Noto Sans CJK SC,system-ui,sans-serif" font-size="27" font-weight="700" text-anchor="start">Shell 画面与普通 scrollback</text>
<text x="112" y="471" fill="#b8c2bd" font-family="Noto Sans CJK SC,system-ui,sans-serif" font-size="24" font-weight="400" text-anchor="start">此刻保留在内存中，未活动</text>
<text x="112" y="506" fill="#b8c2bd" font-family="Noto Sans CJK SC,system-ui,sans-serif" font-size="22" font-weight="400" text-anchor="start">不接收当前的字符绘制操作</text>
<path d="M126 528V688" stroke="#e4c06b" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M116 676L126 688l10 -12" stroke="#e4c06b" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<text x="152" y="574" fill="#e4c06b" font-family="DejaVu Sans Mono,ui-monospace,monospace" font-size="25" font-weight="700" text-anchor="start">CSI ? 1049 h</text>
<text x="152" y="608" fill="#b8c2bd" font-family="Noto Sans CJK SC,system-ui,sans-serif" font-size="22" font-weight="400" text-anchor="start">进入备用屏幕</text>
<path d="M596 688V528" stroke="#8fd0c7" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M586 540L596 528l10 12" stroke="#8fd0c7" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<text x="570" y="633" fill="#8fd0c7" font-family="DejaVu Sans Mono,ui-monospace,monospace" font-size="25" font-weight="700" text-anchor="end">CSI ? 1049 l</text>
<text x="570" y="663" fill="#b8c2bd" font-family="Noto Sans CJK SC,system-ui,sans-serif" font-size="22" font-weight="400" text-anchor="end">返回普通屏幕</text>
<rect x="84" y="688" width="552" height="210" rx="6" fill="#203332" stroke="#8fd0c7" stroke-width="3"/>
<text x="112" y="730" fill="#8fd0c7" font-family="Noto Sans CJK SC,system-ui,sans-serif" font-size="24" font-weight="800" text-anchor="start">ALTERNATE BUFFER</text>
<rect x="464" y="745" width="144" height="44" rx="22" fill="#dce9e6"/>
<text x="536" y="775" fill="#24696e" font-family="Noto Sans CJK SC,system-ui,sans-serif" font-size="23" font-weight="800" text-anchor="middle">当前活动</text>
<text x="112" y="784" fill="#f4f0e7" font-family="Noto Sans CJK SC,system-ui,sans-serif" font-size="29" font-weight="800" text-anchor="start">全屏 TUI</text>
<text x="112" y="833" fill="#b8c2bd" font-family="Noto Sans CJK SC,system-ui,sans-serif" font-size="24" font-weight="400" text-anchor="start">接收光标、擦除与字符写入</text>
<text x="112" y="871" fill="#b8c2bd" font-family="Noto Sans CJK SC,system-ui,sans-serif" font-size="22" font-weight="400" text-anchor="start">图示状态：已执行 1049 h</text>
<path d="M360 932V984" stroke="#24696e" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M350 972L360 984l10 -12" stroke="#24696e" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="56" y="984" width="608" height="110" rx="6" fill="#fbfaf6" stroke="#cbc5b8" stroke-width="2"/>
<text x="84" y="1025" fill="#8d5824" font-family="Noto Sans CJK SC,system-ui,sans-serif" font-size="22" font-weight="700" text-anchor="start">RENDERER</text>
<text x="84" y="1066" fill="#171916" font-family="Noto Sans CJK SC,system-ui,sans-serif" font-size="26" font-weight="800" text-anchor="start">绘制当前活动的 Alternate Buffer</text>
<text x="56" y="1138" fill="#555c55" font-family="Noto Sans CJK SC,system-ui,sans-serif" font-size="23" font-weight="400" text-anchor="start">Buffer 切换不额外创建 PTY 或进程。</text>
</svg>
