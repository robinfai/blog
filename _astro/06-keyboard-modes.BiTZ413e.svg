<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1450" viewBox="0 0 720 1450" role="img" aria-labelledby="title desc">
<title id="title">同一方向键，编码取决于光标键模式</title>
<desc id="desc">输入沿青色箭头向下：上方向键事件到 Terminal，按 Normal 模式编码为 ESC[A，按 Application 模式编码为 ESCOA，再经 PTY 与按 termios 配置工作的 Line Discipline 到应用解析。金色箭头反向表示应用输出 CSI ? 1 h 或 l，改变 Terminal 的光标键模式；该回路仍经 PTY，图中省略输出侧细节。</desc>
<rect width="720" height="1450" fill="#ebe7dc"/>
<text x="44" y="48" font-family="'Noto Sans CJK SC',system-ui,sans-serif" font-size="24" font-weight="600" fill="#515b55" text-anchor="start">06 / KEYBOARD INPUT</text>
<text x="44" y="100" font-family="'Noto Sans CJK SC',system-ui,sans-serif" font-size="36" font-weight="800" fill="#171916" text-anchor="start">同一个键，两种编码</text>
<rect x="76" y="137" width="588" height="122" rx="12" fill="#fbfaf6" stroke="#cbc5b8" stroke-width="2"/>
<text x="108" y="181" font-family="'Noto Sans CJK SC',system-ui,sans-serif" font-size="28" font-weight="600" fill="#515b55" text-anchor="start">桌面键盘事件</text>
<text x="108" y="232" font-family="'Noto Sans CJK SC',system-ui,sans-serif" font-size="34" font-weight="700" fill="#171916" text-anchor="start">按下上方向键</text>
<rect x="554" y="162" width="74" height="70" rx="9" fill="#f4f0e7" stroke="#cbc5b8" stroke-width="2"/>
<path d="M591 216V181 M577 195L591 181L605 195" stroke="#171916" stroke-width="5" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M370 261L370 309" stroke="#2d7e82" stroke-width="5" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M360 296L370 309L380 296" stroke="#2d7e82" stroke-width="5" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="76" y="316" width="588" height="360" rx="12" fill="#203332" stroke="#2d7e82" stroke-width="2"/>
<text x="108" y="366" font-family="'Noto Sans CJK SC',system-ui,sans-serif" font-size="32" font-weight="700" fill="#f4f0e7" text-anchor="start">Terminal 按当前模式编码</text>
<rect x="102" y="398" width="536" height="102" rx="7" fill="#152524" stroke="#53827d" stroke-width="2"/>
<text x="124" y="437" font-family="'Noto Sans CJK SC',system-ui,sans-serif" font-size="27" font-weight="600" fill="#9edbd0" text-anchor="start">Normal</text>
<text x="614" y="440" font-family="'DejaVu Sans Mono',ui-monospace,monospace" font-size="36" font-weight="700" fill="#f4f0e7" text-anchor="end">ESC[A</text>
<text x="124" y="478" font-family="'DejaVu Sans Mono',ui-monospace,monospace" font-size="27" font-weight="400" fill="#9edbd0" text-anchor="start">1b 5b 41</text>
<rect x="102" y="523" width="536" height="102" rx="7" fill="#332f25" stroke="#92704c" stroke-width="2"/>
<text x="124" y="562" font-family="'Noto Sans CJK SC',system-ui,sans-serif" font-size="27" font-weight="600" fill="#e4c06b" text-anchor="start">Application</text>
<text x="614" y="565" font-family="'DejaVu Sans Mono',ui-monospace,monospace" font-size="36" font-weight="700" fill="#f4f0e7" text-anchor="end">ESCOA</text>
<text x="124" y="603" font-family="'DejaVu Sans Mono',ui-monospace,monospace" font-size="27" font-weight="400" fill="#e4c06b" text-anchor="start">1b 4f 41</text>
<text x="108" y="657" font-family="'Noto Sans CJK SC',system-ui,sans-serif" font-size="25" font-weight="400" fill="#f4f0e7" text-anchor="start">ESC 是一个字节；O 是大写字母</text>
<path d="M370 679L370 731" stroke="#2d7e82" stroke-width="5" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M360 718L370 731L380 718" stroke="#2d7e82" stroke-width="5" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="76" y="738" width="588" height="170" rx="12" fill="#fbfaf6" stroke="#cbc5b8" stroke-width="2"/>
<text x="108" y="785" font-family="'Noto Sans CJK SC',system-ui,sans-serif" font-size="30" font-weight="700" fill="#171916" text-anchor="start">PTY / Line Discipline</text>
<text x="108" y="831" font-family="'Noto Sans CJK SC',system-ui,sans-serif" font-size="27" font-weight="400" fill="#515b55" text-anchor="start">传输字节，按 termios 处理输入</text>
<text x="108" y="874" font-family="'Noto Sans CJK SC',system-ui,sans-serif" font-size="27" font-weight="400" fill="#515b55" text-anchor="start">不会补上“按键事件”的边界</text>
<path d="M370 911L370 963" stroke="#2d7e82" stroke-width="5" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M360 950L370 963L380 950" stroke="#2d7e82" stroke-width="5" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="76" y="970" width="588" height="164" rx="12" fill="#fbfaf6" stroke="#cbc5b8" stroke-width="2"/>
<text x="108" y="1016" font-family="'Noto Sans CJK SC',system-ui,sans-serif" font-size="32" font-weight="700" fill="#171916" text-anchor="start">应用的输入解析器</text>
<text x="108" y="1062" font-family="'Noto Sans CJK SC',system-ui,sans-serif" font-size="27" font-weight="400" fill="#515b55" text-anchor="start">跨读取识别序列</text>
<text x="108" y="1105" font-family="'Noto Sans CJK SC',system-ui,sans-serif" font-size="27" font-weight="400" fill="#515b55" text-anchor="start">再决定取历史命令、移动位置等操作</text>
<path d="M76 1052H31V354H69" stroke="#8a6529" stroke-width="5" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M55 344L69 354L55 364" stroke="#8a6529" stroke-width="5" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="44" y="1180" width="620" height="210" rx="12" fill="#eedfb6" stroke="#b49459" stroke-width="2"/>
<text x="76" y="1227" font-family="'Noto Sans CJK SC',system-ui,sans-serif" font-size="28" font-weight="700" fill="#8a6529" text-anchor="start">金线：应用输出，改变终端模式</text>
<text x="76" y="1278" font-family="'DejaVu Sans Mono',ui-monospace,monospace" font-size="30" font-weight="600" fill="#171916" text-anchor="start">CSI ? 1 h</text>
<text x="323" y="1278" font-family="'Noto Sans CJK SC',system-ui,sans-serif" font-size="28" font-weight="400" fill="#171916" text-anchor="start">启用 Application</text>
<text x="76" y="1327" font-family="'DejaVu Sans Mono',ui-monospace,monospace" font-size="30" font-weight="600" fill="#171916" text-anchor="start">CSI ? 1 l</text>
<text x="323" y="1327" font-family="'Noto Sans CJK SC',system-ui,sans-serif" font-size="28" font-weight="400" fill="#171916" text-anchor="start">恢复 Normal</text>
<text x="76" y="1368" font-family="'Noto Sans CJK SC',system-ui,sans-serif" font-size="25" font-weight="400" fill="#515b55" text-anchor="start">输出仍经 PTY；这里只简画方向</text>
</svg>
