<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1080" viewBox="0 0 720 1080" role="img" aria-labelledby="title desc">
<title id="title">TTY Line Discipline 按配置处理输入</title><desc id="desc">两个独立例子：ICANON 开启时 ab 加换行形成可读的一行；ISIG 开启且 VINTR 为 Ctrl-C 时产生发给前台进程组的 SIGINT。回显、行编辑和控制字符识别由配置决定，不是固定流水线。</desc>
<rect width="720" height="1080" fill="#ebe7dc"/>
<text x="56" y="60" fill="#555c55" font-family="Noto Sans CJK SC,system-ui,sans-serif" font-size="20" font-weight="600" text-anchor="start">TTY · CONFIGURABLE INPUT HANDLING</text>
<rect x="56" y="100" width="608" height="176" rx="6" fill="#fbfaf6" stroke="#cbc5b8" stroke-width="2"/>
<text x="84" y="138" fill="#24696e" font-family="Noto Sans CJK SC,system-ui,sans-serif" font-size="24" font-weight="700" text-anchor="start">两个独立的输入例子</text>
<text x="84" y="184" fill="#171916" font-family="DejaVu Sans Mono,ui-monospace,monospace" font-size="28" font-weight="700" text-anchor="start">A  a b Enter</text>
<text x="84" y="234" fill="#171916" font-family="DejaVu Sans Mono,ui-monospace,monospace" font-size="28" font-weight="700" text-anchor="start">B  Ctrl-C</text>
<path d="M360 276V330" stroke="#24696e" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M350 318L360 330l10 -12" stroke="#24696e" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="56" y="330" width="608" height="260" rx="6" fill="#171b1b"/>
<text x="84" y="372" fill="#8fd0c7" font-family="Noto Sans CJK SC,system-ui,sans-serif" font-size="22" font-weight="700" text-anchor="start">LINE DISCIPLINE</text>
<text x="84" y="421" fill="#f4f0e7" font-family="Noto Sans CJK SC,system-ui,sans-serif" font-size="30" font-weight="800" text-anchor="start">按 termios 配置处理输入</text>
<text x="84" y="470" fill="#b8c2bd" font-family="Noto Sans CJK SC,system-ui,sans-serif" font-size="25" font-weight="400" text-anchor="start">ECHO：输入回显</text>
<text x="84" y="513" fill="#b8c2bd" font-family="Noto Sans CJK SC,system-ui,sans-serif" font-size="25" font-weight="400" text-anchor="start">ICANON：行编辑与按行提交</text>
<text x="84" y="556" fill="#b8c2bd" font-family="Noto Sans CJK SC,system-ui,sans-serif" font-size="25" font-weight="400" text-anchor="start">ISIG：识别信号控制字符</text>
<path d="M360 590V628H204V670" stroke="#24696e" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M360 628H516V670" stroke="#24696e" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M194 658l10 12 10 -12" stroke="#24696e" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M506 658l10 12 10 -12" stroke="#24696e" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="56" y="672" width="296" height="256" rx="6" fill="#dce9e6" stroke="#79aaa6" stroke-width="2"/>
<rect x="368" y="672" width="296" height="256" rx="6" fill="#f2e4d2" stroke="#d0b184" stroke-width="2"/>
<text x="80" y="714" fill="#24696e" font-family="Noto Sans CJK SC,system-ui,sans-serif" font-size="22" font-weight="700" text-anchor="start">例子 A · ICANON 开</text>
<text x="80" y="765" fill="#171916" font-family="Noto Sans CJK SC,system-ui,sans-serif" font-size="29" font-weight="800" text-anchor="start">ab + 换行</text>
<text x="80" y="812" fill="#555c55" font-family="Noto Sans CJK SC,system-ui,sans-serif" font-size="24" font-weight="400" text-anchor="start">应用可读到一行</text>
<text x="80" y="854" fill="#555c55" font-family="Noto Sans CJK SC,system-ui,sans-serif" font-size="20" font-weight="400" text-anchor="start">Enter 转换为换行</text>
<text x="80" y="890" fill="#555c55" font-family="Noto Sans CJK SC,system-ui,sans-serif" font-size="20" font-weight="400" text-anchor="start">取决于输入映射配置</text>
<text x="392" y="714" fill="#8d5824" font-family="Noto Sans CJK SC,system-ui,sans-serif" font-size="22" font-weight="700" text-anchor="start">例子 B · ISIG 开</text>
<text x="392" y="765" fill="#171916" font-family="Noto Sans CJK SC,system-ui,sans-serif" font-size="29" font-weight="800" text-anchor="start">SIGINT</text>
<text x="392" y="812" fill="#555c55" font-family="Noto Sans CJK SC,system-ui,sans-serif" font-size="24" font-weight="400" text-anchor="start">发给前台进程组</text>
<text x="392" y="854" fill="#555c55" font-family="Noto Sans CJK SC,system-ui,sans-serif" font-size="20" font-weight="400" text-anchor="start">此例 VINTR = Ctrl-C</text>
<text x="392" y="890" fill="#555c55" font-family="Noto Sans CJK SC,system-ui,sans-serif" font-size="20" font-weight="400" text-anchor="start">该字节不作为文本提交</text>
<text x="56" y="984" fill="#555c55" font-family="Noto Sans CJK SC,system-ui,sans-serif" font-size="24" font-weight="400" text-anchor="start">Raw 配置通常关闭这些处理，</text>
<text x="56" y="1022" fill="#555c55" font-family="Noto Sans CJK SC,system-ui,sans-serif" font-size="24" font-weight="400" text-anchor="start">由应用直接解释输入字节。</text>
</svg>
