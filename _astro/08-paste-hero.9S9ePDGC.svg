<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">粘贴先插入，提交另一步</title>
<desc id="desc">在支持并启用 Bracketed Paste 的交互场景中，Terminal 给粘贴加上边界；行编辑器把文本插入编辑缓冲区；用户检查并提交后，Shell 才处理命令。具体行为由应用决定，边界标记不会检查命令内容。</desc>
<rect width="1200" height="675" fill="#ebe7dc"/>
<text x="58" y="64" font-family="'Noto Sans CJK SC',system-ui,sans-serif" font-size="30" font-weight="600" fill="#515b55" text-anchor="start">08 / BRACKETED PASTE</text>
<text x="58" y="152" font-family="'Noto Sans CJK SC',system-ui,sans-serif" font-size="57" font-weight="800" fill="#171916" text-anchor="start">先插入文本，再决定何时提交</text>
<text x="58" y="213" font-family="'Noto Sans CJK SC',system-ui,sans-serif" font-size="36" font-weight="400" fill="#515b55" text-anchor="start">支持并启用 Bracketed Paste 时</text>
<rect x="48" y="277" width="312" height="252" rx="14" fill="#203332" stroke="#2d7e82" stroke-width="2"/>
<text x="204" y="345" font-family="'Noto Sans CJK SC',system-ui,sans-serif" font-size="43" font-weight="700" fill="#f4f0e7" text-anchor="middle">Terminal</text>
<text x="204" y="491" font-family="'Noto Sans CJK SC',system-ui,sans-serif" font-size="39" font-weight="600" fill="#9edbd0" text-anchor="middle">添加边界</text>
<rect x="444" y="277" width="312" height="252" rx="14" fill="#203332" stroke="#2d7e82" stroke-width="2"/>
<text x="600" y="345" font-family="'Noto Sans CJK SC',system-ui,sans-serif" font-size="43" font-weight="700" fill="#f4f0e7" text-anchor="middle">行编辑器</text>
<text x="600" y="491" font-family="'Noto Sans CJK SC',system-ui,sans-serif" font-size="39" font-weight="600" fill="#9edbd0" text-anchor="middle">插入文本</text>
<rect x="840" y="277" width="312" height="252" rx="14" fill="#332f25" stroke="#8a6529" stroke-width="2"/>
<text x="996" y="345" font-family="'Noto Sans CJK SC',system-ui,sans-serif" font-size="43" font-weight="700" fill="#f4f0e7" text-anchor="middle">用户</text>
<text x="996" y="491" font-family="'Noto Sans CJK SC',system-ui,sans-serif" font-size="39" font-weight="600" fill="#e4c06b" text-anchor="middle">检查 · 提交</text>
<path d="M102 374H89V429H102 M300 374H313V429H300" stroke="#9edbd0" stroke-width="6" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M128 386H274 M128 414H250" stroke="#f4f0e7" stroke-width="7" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M497 386H690 M497 414H654" stroke="#f4f0e7" stroke-width="7" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M667 401V430" stroke="#9edbd0" stroke-width="8" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="921" y="374" width="150" height="67" rx="8" fill="#50452d" stroke="#a99055" stroke-width="2"/>
<text x="996" y="419" font-family="'DejaVu Sans Mono',ui-monospace,monospace" font-size="32" font-weight="600" fill="#e4c06b" text-anchor="middle">Enter</text>
<path d="M375 406L426 406" stroke="#2d7e82" stroke-width="5" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M413 396L426 406L413 416" stroke="#2d7e82" stroke-width="5" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M772 406L823 406" stroke="#8a6529" stroke-width="5" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M810 396L823 406L810 416" stroke="#8a6529" stroke-width="5" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<text x="58" y="607" font-family="'Noto Sans CJK SC',system-ui,sans-serif" font-size="38" font-weight="600" fill="#171916" text-anchor="start">标记划出粘贴边界，应用决定编辑行为</text>
<text x="58" y="653" font-family="'Noto Sans CJK SC',system-ui,sans-serif" font-size="30" font-weight="400" fill="#515b55" text-anchor="start">边界不会检查命令内容</text>
</svg>
